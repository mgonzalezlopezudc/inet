[General]
network = inet.examples.ieee80211ax.preamble_puncturing.Lan80211AxPreamblePuncturing
sim-time-limit = 1s

**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMaxX = 700m
**.constraintAreaMaxY = 500m

**.ap.mobility.typename = "StationaryMobility"
**.host[*].mobility.typename = "StationaryMobility"

**.ap.mobility.initialX = 350m
**.ap.mobility.initialY = 250m

**.host[0].mobility.initialX = 250m
**.host[0].mobility.initialY = 250m

**.host[1].mobility.initialX = 350m
**.host[1].mobility.initialY = 150m

**.host[2].mobility.initialX = 450m
**.host[2].mobility.initialY = 250m

**.host[3].mobility.initialX = 350m
**.host[3].mobility.initialY = 350m

**.mobility.initFromDisplayString = false

**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"

*.radioMedium.sameTransmissionStartTimeCheck = "ignore"

**.opMode = "ax"
*.ap.wlan[*].**.bandName = "5 GHz (80 MHz)"
*.host[*].wlan[*].**.bandName = "5 GHz (80 MHz)"
**.centerFrequency = 5.2GHz
**.channelNumber = 2
**.wlan[*].radio.receiver.bandwidth = 80MHz
**.wlan[*].radio.transmitter.power = 100mW
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB
**.wlan[*].bitrate = 61.25Mbps

**.mac.qosStation = true
**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.mac.hcf.typename = "HeHcf"
**.ap.wlan[*].mac.hcf.dlScheduler.typename = "HeDlSchedulerBacklogBased"
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 4

**.wlan[*].mac.hcf.originatorMacDataService.msduAggregationPolicy.typename = "BasicMsduAggregationPolicy"
**.isBlockAckSupported = true
**.wlan[*].mac.hcf.originatorAckPolicy.maxBlockAckPolicyFrameLength = 2000B

**.displayHeMuSignalDetails = true
**.heMuSignalLabelMaxUsers = 4
**.displayHeMuSignalPhyFields = true

**.server.numApps = 8

**.server.app[0..3].typename = "UdpBasicApp"
**.server.app[0..3].destPort = 5000
**.server.app[0..3].messageLength = 1000B
**.server.app[0..3].sendInterval = 1s
**.server.app[0..3].startTime = 0.2s
**.server.app[0..3].stopTime = 0.25s
**.server.app[0].destAddresses = "host[0]"
**.server.app[0].packetName = "UdpBasicApp0-Warmup"
**.server.app[1].destAddresses = "host[1]"
**.server.app[1].packetName = "UdpBasicApp1-Warmup"
**.server.app[2].destAddresses = "host[2]"
**.server.app[2].packetName = "UdpBasicApp2-Warmup"
**.server.app[3].destAddresses = "host[3]"
**.server.app[3].packetName = "UdpBasicApp3-Warmup"

**.server.app[4..7].typename = "UdpBasicApp"
**.server.app[4..7].destPort = 5000
**.server.app[4..7].messageLength = 1000B
**.server.app[4..7].sendInterval = 2ms
**.server.app[4..7].startTime = 0.3s
**.server.app[4].destAddresses = "host[0]"
**.server.app[4].packetName = "UdpBasicApp0"
**.server.app[5].destAddresses = "host[1]"
**.server.app[5].packetName = "UdpBasicApp1"
**.server.app[6].destAddresses = "host[2]"
**.server.app[6].packetName = "UdpBasicApp2"
**.server.app[7].destAddresses = "host[3]"
**.server.app[7].packetName = "UdpBasicApp3"

**.host[*].numApps = 1
**.host[*].app[0].typename = "UdpSink"
**.host[*].app[0].localPort = 5000

[Config PreamblePuncturing]
description = "Puncture the second 20 MHz subchannel of the 80 MHz channel. The AP validates the mask and scheduler avoids placing RUs on punctured subchannel."
**.ap.wlan[*].mib.heLdpc = true
**.host[*].wlan[*].mib.heLdpc = true
**.ap.wlan[*].mac.hcf.hePreamblePuncturing = "0100"

[Config CleanChannelBaseline]
description = "Unpunctured 80 MHz HE MU-OFDMA without a legacy interferer."
**.ap.wlan[*].mib.heLdpc = true
**.host[*].wlan[*].mib.heLdpc = true

[Config PreamblePuncturingUnderInterference]
description = "Introduce a legacy 802.11a continuous interferer on the second 20 MHz subchannel. The AP uses preamble puncturing to communicate on remaining 60 MHz."
*.ap.wlan[*].**.bandName = "5 GHz (80 MHz)"
*.host[*].wlan[*].**.bandName = "5 GHz (80 MHz)"
*.ap.wlan[*].radio.receiver.bandwidth = 80MHz
*.host[*].wlan[*].radio.receiver.bandwidth = 80MHz
*.ap.wlan[*].mac.*.rateSelection.dataFrameBandwidth = 80MHz
*.host[*].wlan[*].mac.*.rateSelection.dataFrameBandwidth = 80MHz
*.ap.wlan[*].bitrate = 61.25Mbps
*.host[*].wlan[*].bitrate = 61.25Mbps
**.ap.wlan[*].mib.heLdpc = true
**.host[*].wlan[*].mib.heLdpc = true
*.radioMedium.backgroundNoise.typename = ""
*.hasInterferer = true

*.interferer.mobility.typename = "StationaryMobility"
*.interferer.mobility.initialX = 350m
*.interferer.mobility.initialY = 240m
*.interferer.mobility.initFromDisplayString = false

*.interferer.wlan[*].opMode = "a"
*.interferer.**.bandName = "5 GHz (20 MHz)"
*.interferer.**.channelNumber = 9
*.interferer.wlan[*].radio.transmitter.power = 50mW
*.interferer.wlan[*].bitrate = 54Mbps
*.interferer.wlan[*].mac.*.rateSelection.dataFrameBandwidth = 20MHz
*.interferer.wlan[*].mac.*.rateSelection.dataFrameBitrate = 54Mbps
*.interferer.wlan[*].mgmt.typename = "Ieee80211MgmtAdhoc"
*.interferer.ipv4.ip.limitedBroadcast = true
*.configurator.config = xmldoc("configurator.xml")

*.ap.wlan[*].mac.hcf.hePreamblePuncturing = "0100"

*.interferer.numApps = 1
*.interferer.app[0].typename = "UdpBasicApp"
*.interferer.app[0].destAddresses = "255.255.255.255"
*.interferer.app[0].receiveBroadcast = true
*.interferer.app[0].destPort = 5000
*.interferer.app[0].messageLength = 1000B
*.interferer.app[0].sendInterval = 0.5ms
*.interferer.app[0].startTime = 0.1s

**.server.app[4..7].sendInterval = 0.5ms

[Config LegacyInterferenceWithoutPuncturing]
description = "Same active interferer on the second 20 MHz subchannel, but preamble puncturing is disabled."
extends = PreamblePuncturingUnderInterference
*.ap.wlan[*].mac.hcf.hePreamblePuncturing = ""

[Config DynamicPuncturing]
description = "Dynamic Jammer on second 20 MHz subchannel turns ON at 0.3s and OFF at 0.7s."
extends = PreamblePuncturingUnderInterference
*.ap.wlan[*].mac.hcf.hePreamblePuncturing = ""
*.ap.wlan[*].mac.hcf.dynamicHePreamblePuncturing = "0100"
*.ap.wlan[*].mac.hcf.dynamicHePreamblePuncturingStart = 0.35s
*.ap.wlan[*].mac.hcf.dynamicHePreamblePuncturingEnd = 0.7s
*.interferer.app[0].startTime = 0.3s
*.interferer.app[0].stopTime = 0.7s
