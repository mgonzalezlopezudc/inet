[General]
network = inet.examples.ieee80211ax.ul_ofdma.Lan80211AxUlOfdma
sim-time-limit = 1s

**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 50m
**.constraintAreaMaxY = 50m
**.constraintAreaMaxZ = 0m
**.mobility.typename = "StationaryMobility"
**.mobility.initFromDisplayString = false
**.mobility.updateFromDisplayString = false

**.ap.mobility.initialX = 25m
**.ap.mobility.initialY = 25m
**.host[0].mobility.initialX = 20m
**.host[0].mobility.initialY = 25m
**.host[1].mobility.initialX = 25m
**.host[1].mobility.initialY = 20m
**.host[2].mobility.initialX = 30m
**.host[2].mobility.initialY = 25m

**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"

*.radioMedium.sameTransmissionStartTimeCheck = "ignore"

**.opMode = "ax"
**.bandName = "5 GHz (20 MHz)"
**.centerFrequency = 5GHz
**.wlan[*].bitrate = 14.625Mbps
**.wlan[*].radio.transmitter.power = 10mW
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

# Antenna configuration: 6 antennas for AP, 3 for STA 1, 1 for STA 2, 2 for STA 3
**.ap.wlan[*].radio.antenna.numAntennas = 6
**.ap.wlan[*].mib.heDlMuMimoBeamformer = true
**.ap.wlan[*].mib.heSoundingDimensions = 6
**.ap.wlan[*].mib.heFullBandwidthUlMuMimo = true
**.host[*].wlan[*].mib.heFullBandwidthUlMuMimo = true

**.host[0].wlan[*].radio.antenna.numAntennas = 3
**.host[0].wlan[*].mac.hcf.operatingModeRxNss = 3

**.host[1].wlan[*].radio.antenna.numAntennas = 1
**.host[1].wlan[*].mac.hcf.operatingModeRxNss = 1

**.host[2].wlan[*].radio.antenna.numAntennas = 2
**.host[2].wlan[*].mac.hcf.operatingModeRxNss = 2

# MAC and HCF settings
**.mac.qosStation = true
**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.mac.hcf.typename = "HeHcf"
**.ap.wlan[*].mac.hcf.ulScheduler.typename = "HeUlSchedulerBacklogBased"
**.ap.wlan[*].mac.hcf.ulScheduler.minRandomAccessRus = 0
**.ap.wlan[*].mac.hcf.ulScheduler.maxRandomAccessRus = 0
**.host[*].wlan[*].mac.hcf.edca.edcaf[*].muCwMin = 1023
**.host[*].wlan[*].mac.hcf.edca.edcaf[*].muCwMax = 1023
**.host[*].wlan[*].mac.hcf.edca.edcaf[*].muAifsn = 15
**.host[*].wlan[*].mac.hcf.edca.edcaf[*].muEdcaTimer = 100ms
**.ap.wlan[*].mac.hcf.maxHeTbPpduDuration = 1.5ms
**.isBlockAckSupported = true
**.msduAggregationPolicy.typename = ""
**.mpduAggregationPolicy.typename = "VhtMpduAggregationPolicy"
**.maxAmpduLengthExponent = 0

**.server.numApps = 1
**.server.app[0].typename = "UdpSink"
**.server.app[0].localPort = 5000

**.host[*].numApps = 2

# Stage 1: Warmup Trigger (App 0) to establish ADDBA agreements
**.host[*].app[0].typename = "UdpBasicApp"
**.host[*].app[0].packetName = "UdpBasicApp-Warmup-" + string(parentIndex())
**.host[*].app[0].destAddresses = "server"
**.host[*].app[0].destPort = 5000
**.host[*].app[0].messageLength = 1000B
**.host[*].app[0].sendInterval = 1s
**.host[*].app[0].startTime = 0.2s
**.host[*].app[0].stopTime = 0.25s

# Stage 2: Saturated Data Phase (App 1)
**.host[*].app[1].typename = "UdpBasicApp"
**.host[*].app[1].packetName = "UdpBasicApp-" + string(parentIndex())
**.host[*].app[1].destAddresses = "server"
**.host[*].app[1].destPort = 5000
**.host[*].app[1].messageLength = 1000B
**.host[*].app[1].startTime = 0.3s

# ---------------------------------------------------------------------------
# Base Configurations (Abstract)
# ---------------------------------------------------------------------------
[Config UlSuBase]
description = "Uplink single-user EDCA baseline base configuration"
abstract = true
**.wlan[*].mac.hcf.enableUlMuOfdma = false
**.ap.wlan[*].mac.hcf.enableUlMuMimo = false

[Config OfdmaBase]
description = "Uplink OFDMA base configuration"
abstract = true
**.wlan[*].mac.hcf.enableUlMuOfdma = true
**.ap.wlan[*].mac.hcf.enableUlMuMimo = false

[Config UlMuMimoLeakage01Base]
description = "Uplink MU-MIMO base configuration with CSI leakage 0.01"
abstract = true
**.wlan[*].mac.hcf.enableUlMuOfdma = true
**.ap.wlan[*].mac.hcf.enableUlMuMimo = true
**.ap.wlan[*].mac.hcf.defaultCsiLeakage = 0.01

[Config UlMuMimoLeakage001Base]
description = "Uplink MU-MIMO base configuration with CSI leakage 0.001"
abstract = true
**.wlan[*].mac.hcf.enableUlMuOfdma = true
**.ap.wlan[*].mac.hcf.enableUlMuMimo = true
**.ap.wlan[*].mac.hcf.defaultCsiLeakage = 0.001

# ---------------------------------------------------------------------------
# Offered Load 24 Mbit/s (sendInterval = 1ms)
# ---------------------------------------------------------------------------
[Config UlSu24Mbps]
description = "Uplink single-user EDCA baseline at 24 Mbit/s aggregate offered load."
extends = UlSuBase
**.host[*].app[1].sendInterval = 1ms

[Config Ofdma24Mbps]
description = "Uplink OFDMA baseline at 24 Mbit/s aggregate offered load."
extends = OfdmaBase
**.host[*].app[1].sendInterval = 1ms

[Config UlMuMimo24MbpsLeakage01]
description = "Uplink MU-MIMO at 24 Mbit/s aggregate offered load with CSI leakage 0.01."
extends = UlMuMimoLeakage01Base
**.host[*].app[1].sendInterval = 1ms

[Config UlMuMimo24MbpsLeakage001]
description = "Uplink MU-MIMO at 24 Mbit/s aggregate offered load with CSI leakage 0.001."
extends = UlMuMimoLeakage001Base
**.host[*].app[1].sendInterval = 1ms

# ---------------------------------------------------------------------------
# Offered Load 48 Mbit/s (sendInterval = 0.5ms)
# ---------------------------------------------------------------------------
