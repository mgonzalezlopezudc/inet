[General]
network = inet.examples.ieee80211ax.dl_ofdma_sched.Lan80211AxDlOfdma
sim-time-limit = 1s

# Area size and placement
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMaxX = 700m
**.constraintAreaMaxY = 500m

# Stationary coordinates
**.ap.mobility.typename = "StationaryMobility"
**.host[*].mobility.typename = "StationaryMobility"

**.ap.mobility.initialX = 350m
**.ap.mobility.initialY = 250m

**.host[0].mobility.initialX = 330m
**.host[0].mobility.initialY = 250m

**.host[1].mobility.initialX = 350m
**.host[1].mobility.initialY = 220m

**.host[2].mobility.initialX = 370m
**.host[2].mobility.initialY = 250m

**.host[3].mobility.initialX = 350m
**.host[3].mobility.initialY = 350m

**.host[4].mobility.initialX = 250m
**.host[4].mobility.initialY = 150m

**.host[5].mobility.initialX = 450m
**.host[5].mobility.initialY = 150m

**.host[6].mobility.initialX = 450m
**.host[6].mobility.initialY = 350m

**.host[7].mobility.initialX = 250m
**.host[7].mobility.initialY = 350m

**.mobility.initFromDisplayString = false

# Addressing
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"

# Radio medium setting to allow concurrent OFDMA sub-transmissions
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"

# 802.11ax HE base configuration
**.opMode = "ax"
**.bandName = "5 GHz (20 MHz)"
**.centerFrequency = 5GHz
**.wlan[*].bitrate = 14.625Mbps

**.wlan[*].radio.transmitter.power = 100mW
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

# Enable QoS classification and multi-user queuing (Hcf/HeHcf)
**.mac.qosStation = true
**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.mac.hcf.typename = "HeHcf"
**.ap.wlan[*].mac.hcf.dlScheduler.typename = "HeDlSchedulerEqualSizedRUs"
**.ap.wlan[*].mac.hcf.muRateControl.typename = "HeMinstrelRateControl"
**.ap.wlan[*].mac.hcf.muRateControl.maxNss = 6
**.ap.wlan[*].mac.hcf.muRateControl.selectionPolicy = "snrThresholds"
**.ap.wlan[*].mac.hcf.dlScheduler.heRateControlModule = "^.muRateControl"
**.ap.wlan[*].mac.hcf.enableDlMuMimo = false

# Advertise the intended receive-NSS limits for STA {1,2,3}: {3,1,2}.
**.host[0].wlan[*].mac.hcf.operatingModeRxNss = 3
**.host[1].wlan[*].mac.hcf.operatingModeRxNss = 1
**.host[2].wlan[*].mac.hcf.operatingModeRxNss = 2

# Common beamforming capabilities for AP=6, STAs={3,1,2}
**.ap.wlan[*].radio.antenna.numAntennas = 6
**.ap.wlan[*].mib.heDlMuMimoBeamformer = true
**.ap.wlan[*].mib.heSoundingDimensions = 6
**.ap.wlan[*].mib.heFullBandwidthUlMuMimo = true
**.host[*].wlan[*].mib.heFullBandwidthUlMuMimo = true
**.host[0].wlan[*].radio.antenna.numAntennas = 3
**.host[0].wlan[*].mib.heDlMuMimoBeamformee = true
**.host[0].wlan[*].mib.heFeedbackMode = 2
**.host[0].wlan[*].mib.heBeamformeeSts20Mhz = 3
**.host[1].wlan[*].radio.antenna.numAntennas = 1
**.host[1].wlan[*].mib.heDlMuMimoBeamformee = true
**.host[1].wlan[*].mib.heFeedbackMode = 2
**.host[1].wlan[*].mib.heBeamformeeSts20Mhz = 1
**.host[2].wlan[*].radio.antenna.numAntennas = 2
**.host[2].wlan[*].mib.heDlMuMimoBeamformee = true
**.host[2].wlan[*].mib.heFeedbackMode = 2
**.host[2].wlan[*].mib.heBeamformeeSts20Mhz = 2

# Aggregation and Block Ack settings
**.wlan[*].mac.hcf.originatorMacDataService.msduAggregationPolicy.typename = "BasicMsduAggregationPolicy"
**.isBlockAckSupported = true

# Server applications: three short warm-up flows establish Block Ack state,
# followed by three measured flows to the same stations.
**.server.numApps = 6
**.server.app[*].typename = "UdpBasicApp"
**.server.app[*].destPort = 5000
**.server.app[0..2].messageLength = 100B
**.server.app[0..2].sendInterval = 1s
**.server.app[0..2].startTime = 0.2s
**.server.app[0..2].stopTime = 0.25s
**.server.app[0].destAddresses = "host[0]"
**.server.app[1].destAddresses = "host[1]"
**.server.app[2].destAddresses = "host[2]"
**.server.app[3..5].messageLength = 1000B
**.server.app[3..5].startTime = 0.3s
**.server.app[3].destAddresses = "host[0]"
**.server.app[4].destAddresses = "host[1]"
**.server.app[5].destAddresses = "host[2]"

# Host applications (UdpSinks)
**.host[*].numApps = 1
**.host[*].app[0].typename = "UdpSink"
**.host[*].app[0].localPort = 5000

# ---------------------------------------------------------------------------
# 24 Mbit/s Offered Load Configurations
# ---------------------------------------------------------------------------
[Config SuMimo24Mbps]
description = "SU-MIMO at 24 Mbit/s aggregate offered load."
**.ap.wlan[*].mac.hcf.enableDlMuMimo = false
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 1
**.server.app[3..5].sendInterval = 1ms

[Config OfdmaSuMimo24Mbps]
description = "Downlink OFDMA with SU-MIMO inside each RU at 24 Mbit/s aggregate offered load."
**.ap.wlan[*].mac.hcf.enableDlMuMimo = false
**.ap.wlan[*].mac.hcf.dlScheduler.typename = "HeDlSchedulerEqualSizedRUs"
**.ap.wlan[*].mac.hcf.dlScheduler.schedulingFunction = "fBW"
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = -1
**.server.app[3..5].sendInterval = 1ms

[Config DlMuMimo24MbpsLeakage001]
description = "Downlink MU-MIMO at 24 Mbit/s aggregate offered load with CSI leakage 0.001."
**.ap.wlan[*].mac.hcf.enableDlMuMimo = true
**.ap.wlan[*].mac.hcf.defaultCsiLeakage = 0.001
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = -1
**.server.app[3..5].sendInterval = 1ms

# ---------------------------------------------------------------------------
# 48 Mbit/s Offered Load Configurations
# ---------------------------------------------------------------------------
[Config SuMimo48Mbps]
description = "SU-MIMO at 48 Mbit/s aggregate offered load."
**.ap.wlan[*].mac.hcf.enableDlMuMimo = false
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 1
**.server.app[3..5].sendInterval = 0.5ms

[Config OfdmaSuMimo48Mbps]
description = "Downlink OFDMA with SU-MIMO inside each RU at 48 Mbit/s aggregate offered load."
**.ap.wlan[*].mac.hcf.enableDlMuMimo = false
**.ap.wlan[*].mac.hcf.dlScheduler.typename = "HeDlSchedulerEqualSizedRUs"
**.ap.wlan[*].mac.hcf.dlScheduler.schedulingFunction = "fBW"
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = -1
**.server.app[3..5].sendInterval = 0.5ms

[Config DlMuMimo48MbpsLeakage001]
description = "Downlink MU-MIMO at 48 Mbit/s aggregate offered load with CSI leakage 0.001."
**.ap.wlan[*].mac.hcf.enableDlMuMimo = true
**.ap.wlan[*].mac.hcf.defaultCsiLeakage = 0.001
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = -1
**.server.app[3..5].sendInterval = 0.5ms

# ---------------------------------------------------------------------------
# 72 Mbit/s Offered Load Configurations
# ---------------------------------------------------------------------------
[Config SuMimo72Mbps]
description = "SU-MIMO at 72 Mbit/s aggregate offered load."
**.ap.wlan[*].mac.hcf.enableDlMuMimo = false
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 1
**.server.app[3..5].sendInterval = 0.333333333333ms

[Config OfdmaSuMimo72Mbps]
description = "Downlink OFDMA with SU-MIMO inside each RU at 72 Mbit/s aggregate offered load."
**.ap.wlan[*].mac.hcf.enableDlMuMimo = false
**.ap.wlan[*].mac.hcf.dlScheduler.typename = "HeDlSchedulerEqualSizedRUs"
**.ap.wlan[*].mac.hcf.dlScheduler.schedulingFunction = "fBW"
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = -1
**.server.app[3..5].sendInterval = 0.333333333333ms

[Config DlMuMimo72MbpsLeakage001]
description = "Downlink MU-MIMO at 72 Mbit/s aggregate offered load with CSI leakage 0.001."
**.ap.wlan[*].mac.hcf.enableDlMuMimo = true
**.ap.wlan[*].mac.hcf.defaultCsiLeakage = 0.001
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = -1
**.server.app[3..5].sendInterval = 0.333333333333ms

