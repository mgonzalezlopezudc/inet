include ../../dl_ofdma_sched/omnetpp.ini

# The focused 20 MHz comparison uses the same acknowledgment method and
# application load in both treatments. Sequential BAR avoids filling a
# 64-entry MU Block Ack window and then stopping service; 1000-byte payloads
# keep the channel backlogged enough for simultaneous spatial streams to
# produce an observable capacity contrast.
[Config DlMuMimo]
**.ap.wlan[*].mac.hcf.dlMuAckMethod = "sequentialBar"
**.server.app[3..5].messageLength = 1000B

[Config EqualSizedRUs_fBW]
**.ap.wlan[*].mac.hcf.dlMuAckMethod = "sequentialBar"
**.server.app[3..5].messageLength = 1000B

# Eight-station association, ADDBA setup, and initial sounding extend beyond
# the canonical 0.25 s warm-up. Record this focused wide-band scenario only
# after every beamformee has entered steady-state MU service.
[Config DlMuMimo80MHz]
warmup-period = 0.7s
