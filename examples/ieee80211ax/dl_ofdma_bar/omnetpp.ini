[General]
network = inet.examples.ieee80211ax.dl_ofdma_bar.Lan80211AxDlOfdmaBar
sim-time-limit = 1s
warmup-period = 0.25s

# Area size and placement
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMaxX = 500m
**.constraintAreaMaxY = 400m

# Stationary coordinates
**.ap.mobility.typename = "StationaryMobility"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m

**.host[0].mobility.typename = "StationaryMobility"
**.host[0].mobility.initialX = 150m
**.host[0].mobility.initialY = 200m

**.host[1].mobility.typename = "StationaryMobility"
**.host[1].mobility.initialX = 200m
**.host[1].mobility.initialY = 150m

**.host[2].mobility.typename = "StationaryMobility"
**.host[2].mobility.initialX = 150m
**.host[2].mobility.initialY = 150m

**.mobility.initFromDisplayString = false

# Addressing
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"

# Radio medium setting to allow concurrent OFDMA sub-transmissions
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"

# 802.11ax HE configurations
**.opMode = "ax"
**.bandName = "5 GHz (20 MHz)"
**.centerFrequency = 5GHz
**.wlan[*].bitrate = 14.625Mbps
**.wlan[*].radio.transmitter.power = 100mW
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB
**.displayHeMuSignalDetails = true
**.heMuSignalLabelMaxUsers = 3
**.displayHeMuSignalPhyFields = true
# Only allow MCS 0 and 1 for the three STAs to ensure OFDMA uses an MCS not higher than SU OFDM
**.ap.wlan[*].mac.hcf.dlScheduler.heMcsSnrThresholds = "-100 -100 1000 1000 1000 1000 1000 1000 1000 1000 1000 1000"

# Enable QoS classification and multi-user queuing (Hcf/HeHcf)
**.mac.qosStation = true
**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.mac.hcf.typename = "HeHcf"
**.ap.wlan[*].mac.hcf.dlScheduler.typename = "HeDlSchedulerEqualSizedRUs"
**.ap.wlan[*].mac.hcf.dlScheduler.schedulingFunction = "fBW"
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 3

# Aggregation and Block Ack settings
**.wlan[*].mac.hcf.originatorMacDataService.msduAggregationPolicy.typename = "BasicMsduAggregationPolicy"
**.isBlockAckSupported = true
**.wlan[*].mac.hcf.originatorAckPolicy.maxBlockAckPolicyFrameLength = 2000B
**.mac.hcf.originatorBlockAckAgreementPolicy.addbaFailureTimeout = 10ms

# Downlink UDP Application Traffic from Server to Hosts
# Port 5000 maps to UP_VO/TID 6 in ExampleQosClassifier.
**.server.numApps = 6

# Stage 1: Warmup Trigger (Apps 0-2) to establish ADDBA agreements
**.server.app[0..2].typename = "UdpBasicApp"
**.server.app[0..2].destPort = 5000
**.server.app[0..2].messageLength = 100B
**.server.app[0..2].sendInterval = 1s
**.server.app[0..2].startTime = 0.2s
**.server.app[0..2].stopTime = 0.25s
**.server.app[0].destAddresses = "host[0]"
**.server.app[0].packetName = "UdpBasicApp0-Warmup"
**.server.app[1].destAddresses = "host[1]"
**.server.app[1].packetName = "UdpBasicApp1-Warmup"
**.server.app[2].destAddresses = "host[2]"
**.server.app[2].packetName = "UdpBasicApp2-Warmup"

# Stage 2: Measured High-Load Data Phase (Apps 3-5)
**.server.app[3..5].typename = "UdpBasicApp"
**.server.app[3..5].destPort = 5000
**.server.app[3..5].messageLength = 100B
**.server.app[3..5].sendInterval = 0.5ms
**.server.app[3..5].startTime = 0.3s
**.server.app[3].destAddresses = "host[0]"
**.server.app[3].packetName = "UdpBasicApp0"
**.server.app[4].destAddresses = "host[1]"
**.server.app[4].packetName = "UdpBasicApp1"
**.server.app[5].destAddresses = "host[2]"
**.server.app[5].packetName = "UdpBasicApp2"

# Host Applications (UdpSinks)
**.host[*].numApps = 1
**.host[*].app[0].typename = "UdpSink"
**.host[*].app[0].localPort = 5000

[Config TriggeredBar]
description = "Downlink OFDMA with MU-BAR Trigger frame for concurrent uplink Block Ack responses (fBW policy)"
**.ap.wlan[*].mac.hcf.dlMuAckMethod = "muBarTrigger"

[Config SequentialBar]
description = "Downlink OFDMA with sequential unicast Block Ack Request (BAR) frames (fBW policy)"
**.ap.wlan[*].mac.hcf.dlMuAckMethod = "sequentialBar"

[Config TriggeredBarfHoL]
description = "Downlink OFDMA with MU-BAR Trigger frame using fHoL scheduling policy"
**.ap.wlan[*].mac.hcf.dlMuAckMethod = "muBarTrigger"
**.ap.wlan[*].mac.hcf.dlScheduler.schedulingFunction = "fHoL"

[Config SequentialBarfHoL]
description = "Downlink OFDMA with sequential unicast Block Ack Request (BAR) frames using fHoL scheduling policy"
**.ap.wlan[*].mac.hcf.dlMuAckMethod = "sequentialBar"
**.ap.wlan[*].mac.hcf.dlScheduler.schedulingFunction = "fHoL"

[Config SuBaseline]
description = "Downlink Single-User (DL SU) baseline using single-user HE PPDUs and Block Ack (BA)"
**.mac.hcf.typename = "Hcf"
# DL OFDMA has one 100-packet queue per STA. Match its aggregate
# three-STA buffer budget in the SU baseline's single shared AC_VO queue.
**.ap.wlan[*].mac.hcf.edca.edcaf[3].pendingQueue.packetCapacity = 300
