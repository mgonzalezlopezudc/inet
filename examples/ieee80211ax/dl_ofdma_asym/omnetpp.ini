include ../dl_ofdma_sched/omnetpp.ini

[General]
network = inet.examples.ieee80211ax.dl_ofdma_sched.Lan80211AxDlOfdma

# The common topology, HE radio, aggregation, and application defaults are
# inherited from dl_ofdma_sched. These configurations vary only the scheduler
# and the asymmetric measured traffic.

[Config BacklogBased]
description = "Backlog-Based Scheduler: dynamic RU sizing with asymmetric traffic"
**.ap.wlan[*].mac.hcf.dlScheduler.typename = "HeDlSchedulerBacklogBased"
**.server.app[3].messageLength = 1000B
**.server.app[3].sendInterval = 2ms
**.server.app[4].messageLength = 400B
**.server.app[4].sendInterval = 2ms
**.server.app[5].messageLength = 100B
**.server.app[5].sendInterval = 2ms

[Config HoLMinDelay]
description = "Head-of-Line Minimum Delay Scheduler with asymmetric traffic"
**.ap.wlan[*].mac.hcf.dlScheduler.typename = "HeDlSchedulerHoLMinDelay"
**.server.app[3].messageLength = 1000B
**.server.app[3].sendInterval = 2ms
**.server.app[4].messageLength = 400B
**.server.app[4].sendInterval = 2ms
**.server.app[5].messageLength = 100B
**.server.app[5].sendInterval = 2ms

[Config BacklogBased4ms]
extends = BacklogBased
description = "Backlog-Based Scheduler with 1 pkt/4ms asymmetric traffic"
**.server.app[3..5].sendInterval = 4ms

[Config HoLMinDelay4ms]
extends = HoLMinDelay
description = "Head-of-Line Minimum Delay Scheduler with 1 pkt/4ms asymmetric traffic"
**.server.app[3..5].sendInterval = 4ms

[Config BacklogBased3ms]
extends = BacklogBased
description = "Backlog-Based Scheduler with 1 pkt/3ms asymmetric traffic"
**.server.app[3..5].sendInterval = 3ms

[Config HoLMinDelay3ms]
extends = HoLMinDelay
description = "Head-of-Line Minimum Delay Scheduler with 1 pkt/3ms asymmetric traffic"
**.server.app[3..5].sendInterval = 3ms

[Config BacklogBased3_5ms]
extends = BacklogBased
description = "Backlog-Based Scheduler with 1 pkt/3.5ms asymmetric traffic"
**.server.app[3..5].sendInterval = 3.5ms

[Config HoLMinDelay3_5ms]
extends = HoLMinDelay
description = "Head-of-Line Minimum Delay Scheduler with 1 pkt/3.5ms asymmetric traffic"
**.server.app[3..5].sendInterval = 3.5ms

[Config BacklogBased2_5ms]
extends = BacklogBased
description = "Backlog-Based Scheduler with 1 pkt/2.5ms asymmetric traffic"
**.server.app[3..5].sendInterval = 2.5ms

[Config HoLMinDelay2_5ms]
extends = HoLMinDelay
description = "Head-of-Line Minimum Delay Scheduler with 1 pkt/2.5ms asymmetric traffic"
**.server.app[3..5].sendInterval = 2.5ms

[Config BacklogBased1_5ms]
extends = BacklogBased
description = "Backlog-Based Scheduler with 1 pkt/1.5ms asymmetric traffic"
**.server.app[3..5].sendInterval = 1.5ms

[Config HoLMinDelay1_5ms]
extends = HoLMinDelay
description = "Head-of-Line Minimum Delay Scheduler with 1 pkt/1.5ms asymmetric traffic"
**.server.app[3..5].sendInterval = 1.5ms
