[General]
network = Lan80211AxUlOfdma
**.numHosts = 8
sim-time-limit = 1s

**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 50m
**.constraintAreaMaxY = 50m
**.constraintAreaMaxZ = 0m


**.ap.mobility.initialX = 25m
**.ap.mobility.initialY = 25m
**.ap.mobility.typename = "StationaryMobility"
**.ap.mobility.initFromDisplayString = false
**.ap.mobility.updateFromDisplayString = false
**.host[0].mobility.initialX = 20m
**.host[0].mobility.initialY = 25m
**.host[1].mobility.initialX = 25m
**.host[1].mobility.initialY = 20m
**.host[2].mobility.initialX = 30m
**.host[2].mobility.initialY = 25m
**.host[*].mobility.typename = "StationaryMobility"
**.host[*].mobility.initFromDisplayString = false
**.host[*].mobility.updateFromDisplayString = false

**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"

*.radioMedium.sameTransmissionStartTimeCheck = "ignore"

**.opMode = "ax"
**.bandName = "5 GHz (20 MHz)"
**.centerFrequency = 5GHz
# Keep the radio's fallback PHY mode at HE MCS 1, NSS 1.  Rate-control
# settings do not constrain this mode when a frame has no ModeReq tag.
**.wlan[*].bitrate = 14.625Mbps
**.wlan[*].radio.transmitter.power = 10mW
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

# Explicit one-antenna radios everywhere
**.wlan[*].radio.antenna.numAntennas = 1

# Force HE SU rate selection to MCS 1, NSS 1
**.wlan[*].mac.hcf.rateControl.typename = "HeMinstrelRateControl"
**.wlan[*].mac.hcf.rateControl.minMcs = 1
**.wlan[*].mac.hcf.rateControl.maxMcs = 1
**.wlan[*].mac.hcf.rateControl.maxNss = 1
**.wlan[*].mac.hcf.rateSelection.rateControlModule = "^.rateControl"

# Force HE-TB UL scheduling to MCS 1
**.ap.wlan[*].mac.hcf.ulScheduler.defaultMcs = 1
**.ap.wlan[*].mac.hcf.ulScheduler.heRateControlModule = "^.rateControl"

**.mac.qosStation = true
**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.mac.hcf.typename = "HeHcf"
**.wlan[*].mac.hcf.enableUlMuOfdma = true
**.ap.wlan[*].mac.hcf.ulTriggerCheckInterval = 10ms
**.ap.wlan[*].mac.hcf.ulCoordinator.reportMaxAge = 10ms
**.ap.wlan[*].mac.hcf.ulScheduler.minRandomAccessRus = 0
**.ap.wlan[*].mac.hcf.ulScheduler.maxRandomAccessRus = 0
**.host[*].wlan[*].mac.hcf.edca.edcaf[*].muCwMin = 255
**.host[*].wlan[*].mac.hcf.edca.edcaf[*].muCwMax = 1023
**.host[*].wlan[*].mac.hcf.edca.edcaf[*].muAifsn = 0
**.host[*].wlan[*].mac.hcf.edca.edcaf[*].muEdcaTimer = 2.089s
**.isBlockAckSupported = true
**.msduAggregationPolicy.typename = ""
**.mpduAggregationPolicy.typename = "VhtMpduAggregationPolicy"
**.maxAmpduLengthExponent = 0

**.server.numApps = 1
**.server.app[0].typename = "UdpSink"
**.server.app[0].localPort = 5000

**.host[*].numApps = 2

# Stage 1: Warmup Trigger (App 0) to establish ADDBA agreements
**.host[*].app[0].typename = "UdpBasicApp"
**.host[*].app[0].packetName = "UdpBasicApp-Warmup-" + string(parentIndex())
**.host[*].app[0].destAddresses = "server"
**.host[*].app[0].destPort = 5000
**.host[*].app[0].messageLength = 100B
**.host[*].app[0].sendInterval = 1s
**.host[*].app[0].startTime = 0.2s
**.host[*].app[0].stopTime = 0.25s

# Stage 2: Saturated Data Phase (App 1)
**.host[*].app[1].typename = "UdpBasicApp"
**.host[*].app[1].packetName = "UdpBasicApp-" + string(parentIndex())
**.host[*].app[1].destAddresses = "server"
**.host[*].app[1].destPort = 5000
**.host[*].app[1].messageLength = 100B
**.host[*].app[1].sendInterval = 5ms
**.host[*].app[1].startTime = 0.3s

[Config BacklogBased]
description = "Scheduled UL OFDMA using the backlog-based scheduler."
**.ap.wlan[*].mac.hcf.ulScheduler.typename = "HeUlSchedulerBacklogBased"

[Config EqualSizedRUs]
description = "Scheduled UL OFDMA using the equal-sized RU scheduler."
**.ap.wlan[*].mac.hcf.ulScheduler.typename = "HeUlSchedulerEqualSizedRUs"

[Config EdcaBaseline]
description = "Uplink baseline using standard single-user EDCA; compare with the scheduled OFDMA configurations to see trigger overhead vs contention gains."
**.wlan[*].mac.hcf.enableUlMuOfdma = false

[Config AsymmetricBacklog]
description = "Bounded backlog-based validation with deterministic per-station offered loads that expose unequal scheduler inputs."
extends = BacklogBased
**.host[*].app[*].messageLength = 256B
**.host[0].app[1].sendInterval = 1ms
**.host[1].app[1].sendInterval = 2ms
**.host[2].app[1].sendInterval = 4ms

