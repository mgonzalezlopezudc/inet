[General]
network = inet.examples.ieee80211ax.dl_ul_ofdma.Lan80211AxDlUlOfdma
sim-time-limit = 2s
warmup-period = 0.25s
repeat = 5

# Three nearby stations keep the comparison MAC-limited rather than
# propagation-limited.
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 100m
**.constraintAreaMaxY = 100m
**.constraintAreaMaxZ = 0m
**.mobility.typename = "StationaryMobility"
**.mobility.initFromDisplayString = false
**.mobility.updateFromDisplayString = false
**.ap.mobility.initialX = 50m
**.ap.mobility.initialY = 50m
**.host[0].mobility.initialX = 40m
**.host[0].mobility.initialY = 40m
**.host[1].mobility.initialX = 50m
**.host[1].mobility.initialY = 40m
**.host[2].mobility.initialX = 60m
**.host[2].mobility.initialY = 40m
# Association and addressing
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"

# Allow the simultaneous RU transmissions that form an OFDMA PPDU.
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"

# Matched single-stream HE PHY. MCS 1 is used by SU, DL MU, and HE-TB UL.
**.opMode = "ax"
**.bandName = "5 GHz (20 MHz)"
**.centerFrequency = 5GHz
**.wlan[*].bitrate = 14.625Mbps
**.wlan[*].radio.antenna.numAntennas = 1
**.wlan[*].radio.transmitter.power = 20mW
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB
**.wlan[*].mac.hcf.rateControl.typename = "HeMinstrelRateControl"
**.wlan[*].mac.hcf.rateControl.minMcs = 1
**.wlan[*].mac.hcf.rateControl.maxMcs = 1
**.wlan[*].mac.hcf.rateControl.maxNss = 1
**.wlan[*].mac.hcf.rateSelection.rateControlModule = "^.rateControl"
**.ap.wlan[*].mac.hcf.dlScheduler.heMcsSnrThresholds = "-100 -100 1000 1000 1000 1000 1000 1000 1000 1000 1000 1000"
**.ap.wlan[*].mac.hcf.ulScheduler.defaultMcs = 1
**.ap.wlan[*].mac.hcf.ulScheduler.heRateControlModule = "^.rateControl"

# QoS and Block Ack settings shared by both configurations.
**.mac.qosStation = true
**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.isBlockAckSupported = true
**.wlan[*].mac.hcf.originatorAckPolicy.maxBlockAckPolicyFrameLength = 2000B
**.mac.hcf.originatorBlockAckAgreementPolicy.addbaFailureTimeout = 10ms
**.msduAggregationPolicy.typename = ""
**.mpduAggregationPolicy.typename = "VhtMpduAggregationPolicy"
**.maxAmpduLengthExponent = 0

# Bidirectional best-effort UDP. Small packets make per-transmission
# contention and preamble overhead visible. The downlink is deliberately
# heavier, while the uplink remains continuously active throughout the
# measurement interval.
**.server.numApps = 7
**.server.app[0].typename = "UdpSink"
**.server.app[0].localPort = 80

# One warm-up packet per DL peer establishes the Block Ack agreements.
**.server.app[1..3].typename = "UdpBasicApp"
**.server.app[1..3].destPort = 80
**.server.app[1..3].messageLength = 100B
**.server.app[1..3].sendInterval = 1s
**.server.app[1..3].startTime = 0.2s
**.server.app[1..3].stopTime = 0.25s
**.server.app[1].destAddresses = "host[0]"
**.server.app[2].destAddresses = "host[1]"
**.server.app[3].destAddresses = "host[2]"

# Sustained DL measurement traffic: 2.4 Mbps offered in aggregate.
**.server.app[4..6].typename = "UdpBasicApp"
**.server.app[4..6].destPort = 80
**.server.app[4..6].messageLength = 100B
**.server.app[4..6].sendInterval = 1ms
**.server.app[4..6].startTime = 0.3s
**.server.app[4].destAddresses = "host[0]"
**.server.app[5].destAddresses = "host[1]"
**.server.app[6].destAddresses = "host[2]"

**.host[*].numApps = 3
**.host[*].app[0].typename = "UdpSink"
**.host[*].app[0].localPort = 80

# One warm-up packet per UL peer establishes the reverse Block Ack agreements.
**.host[*].app[1].typename = "UdpBasicApp"
**.host[*].app[1].destAddresses = "server"
**.host[*].app[1].destPort = 80
**.host[*].app[1].messageLength = 100B
**.host[*].app[1].sendInterval = 1s
**.host[*].app[1].startTime = 0.2s
**.host[*].app[1].stopTime = 0.25s

# Sustained UL measurement traffic: 0.48 Mbps offered in aggregate.
**.host[*].app[2].typename = "UdpBasicApp"
**.host[*].app[2].destAddresses = "server"
**.host[*].app[2].destPort = 80
**.host[*].app[2].messageLength = 100B
**.host[*].app[2].sendInterval = 5ms
**.host[*].app[2].startTime = 0.3s

[Config Ofdma]
description = "Bidirectional HE OFDMA with equal-sized DL RUs and backlog-based scheduled UL RUs"
**.mac.hcf.typename = "HeHcf"
**.ap.wlan[*].mac.hcf.dlScheduler.typename = "HeDlSchedulerEqualSizedRUs"
**.ap.wlan[*].mac.hcf.dlScheduler.schedulingFunction = "fHoL"
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 3
**.wlan[*].mac.hcf.enableUlMuOfdma = true
**.ap.wlan[*].mac.hcf.ulTriggerPolicy.minimumTriggerInterval = 50ms
**.ap.wlan[*].mac.hcf.ulScheduler.typename = "HeUlSchedulerBacklogBased"
**.ap.wlan[*].mac.hcf.ulScheduler.maxMuStations = 3
**.ap.wlan[*].mac.hcf.ulScheduler.minRandomAccessRus = 0
**.ap.wlan[*].mac.hcf.ulScheduler.maxRandomAccessRus = 0

[Config Su]
description = "Matched bidirectional single-user HE EDCA baseline"
**.mac.hcf.typename = "HeHcf"
**.wlan[*].mac.hcf.enableUlMuOfdma = false
# A zero candidate limit makes the DL scheduler return no MU allocation, so
# HeHcf uses its SU fallback while retaining the same per-station queue banks.
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 0
