[General]
network = inet.examples.ieee80211ax.ul_ofdma.Lan80211AxUlOfdma
sim-time-limit = 1s

**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 50m
**.constraintAreaMaxY = 50m
**.constraintAreaMaxZ = 0m
**.mobility.typename = "StationaryMobility"
**.mobility.initFromDisplayString = false
**.mobility.updateFromDisplayString = false

**.ap.mobility.initialX = 25m
**.ap.mobility.initialY = 25m
**.host[0].mobility.initialX = 20m
**.host[0].mobility.initialY = 25m
**.host[1].mobility.initialX = 25m
**.host[1].mobility.initialY = 20m
**.host[2].mobility.initialX = 30m
**.host[2].mobility.initialY = 25m

**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"

*.radioMedium.sameTransmissionStartTimeCheck = "ignore"

**.opMode = "ax"
**.bandName = "5 GHz (20 MHz)"
**.centerFrequency = 5GHz
**.wlan[*].bitrate = 14.625Mbps
**.wlan[*].radio.transmitter.power = 10mW
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

**.mac.qosStation = true
**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.mac.hcf.typename = "HeHcf"
**.isBlockAckSupported = true
**.msduAggregationPolicy.typename = ""
**.mpduAggregationPolicy.typename = "VhtMpduAggregationPolicy"
**.maxAmpduLengthExponent = 0

**.ap.wlan[*].mib.heMultiTidAggregationRx = true
**.ap.wlan[*].mib.heMultiTidAggregationTx = true
**.host[*].wlan[*].mib.heMultiTidAggregationRx = true
**.host[*].wlan[*].mib.heMultiTidAggregationTx = true

[Config UlSuMultiTidBlockAck]
description = "HE UL SU Multi-STA Block Ack: A single station transmits a Multi-TID A-MPDU using EDCA; the AP acknowledges with a Multi-STA BlockAck frame (as per the standard: not a Multi-TID BlockAck)."
*.numHosts = 1
**.wlan[*].mac.hcf.enableUlMuOfdma = false

**.host[0].numApps = 2
**.host[0].app[0].typename = "UdpBasicApp"
**.host[0].app[0].packetName = "UL-VO-h0"
**.host[0].app[0].destAddresses = "server"
**.host[0].app[0].destPort = 5000
**.host[0].app[0].messageLength = 1000B
**.host[0].app[0].sendInterval = 5ms
**.host[0].app[0].startTime = 0.3s

**.host[0].app[1].typename = "UdpBasicApp"
**.host[0].app[1].packetName = "UL-NC-h0"
**.host[0].app[1].destAddresses = "server"
**.host[0].app[1].destPort = 5001
**.host[0].app[1].messageLength = 200B
**.host[0].app[1].sendInterval = 10ms
**.host[0].app[1].startTime = 0.3s

**.server.numApps = 2
**.server.app[0].typename = "UdpSink"
**.server.app[0].localPort = 5000
**.server.app[1].typename = "UdpSink"
**.server.app[1].localPort = 5001

[Config UlSUHTAMpduCompressedBlockAck]
description = "HT UL SU same-TID A-MPDU followed after SIFS by a Compressed Block Ack, with no on-air BAR."
extends = UlSuMultiTidBlockAck
**.opMode = "n(mixed-2.4Ghz)"
**.wlan[*].bitrate = 14.4444Mbps
**.wlan[*].radio.antenna.numAntennas = 1
**.wlan[*].mac.hcf.useImplicitBlockAck = true
**.host[0].numApps = 1
**.host[0].app[0].messageLength = 200B
**.host[0].app[0].sendInterval = 0.1ms
**.server.numApps = 1

[Config UlMuMultiTidBlockAck]
description = "HE UL MU OFDMA Multi-STA Block Ack: Multiple stations transmit concurrently in response to an AP Trigger; AP returns a Multi-STA BlockAck."
**.wlan[*].mac.hcf.enableUlMuOfdma = true
**.ap.wlan[*].mac.hcf.ulScheduler.typename = "HeUlSchedulerBacklogBased"
**.ap.wlan[*].mac.hcf.ulScheduler.minRandomAccessRus = 0
**.ap.wlan[*].mac.hcf.ulScheduler.maxRandomAccessRus = 0

**.host[0].numApps = 1
**.host[0].app[0].typename = "UdpBasicApp"
**.host[0].app[0].packetName = "UL-VO-h0"
**.host[0].app[0].destAddresses = "server"
**.host[0].app[0].destPort = 5000
**.host[0].app[0].messageLength = 1000B
**.host[0].app[0].sendInterval = 5ms
**.host[0].app[0].startTime = 0.3s

**.host[1].numApps = 1
**.host[1].app[0].typename = "UdpBasicApp"
**.host[1].app[0].packetName = "UL-NC-h1"
**.host[1].app[0].destAddresses = "server"
**.host[1].app[0].destPort = 5001
**.host[1].app[0].messageLength = 1000B
**.host[1].app[0].sendInterval = 5ms
**.host[1].app[0].startTime = 0.3s

**.host[2].numApps = 0

**.server.numApps = 2
**.server.app[0].typename = "UdpSink"
**.server.app[0].localPort = 5000
**.server.app[1].typename = "UdpSink"
**.server.app[1].localPort = 5001
