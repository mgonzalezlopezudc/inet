[General]
network = inet.examples.ieee80211.common.SingleBssNetwork
sim-time-limit = 1s

**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.wlan[*].mac.qosStation = true

# BSS setup
**.opMode = "n(mixed-2.4Ghz)"
**.numHosts = 3

# AP Address & Position
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m
**.host[*].mobility.initialY = 200m
**.host[0].mobility.initialX = 260m
**.host[1].mobility.initialX = 270m
**.host[2].mobility.initialX = 280m

# UDP traffic setup
*.server.numApps = 3
*.server.app[0..2].typename = "UdpBasicApp"
*.server.app[0..2].packetName = "UdpBasicApp" + string(index)
*.server.app[0..2].destAddresses = "host[" + string(index) + "]"
*.server.app[0..2].messageLength = 1000B
*.server.app[0..2].sendInterval = 0.2ms
*.server.app[0..2].startTime = 0.2s
*.server.app[0..2].stopTime = 0.9s
*.server.app[0].destPort = 5000
*.server.app[1].destPort = 5001
*.server.app[2].destPort = 5002

*.host[*].numApps = 1
*.host[*].app[0].typename = "UdpSink"
*.host[0].app[0].localPort = 5000
*.host[1].app[0].localPort = 5001
*.host[2].app[0].localPort = 5002

# Pin the HT data mode and legacy management/control response modes.  The
# explicit values avoid an ambiguous fastest-mode lookup while peer HT
# capabilities are negotiated by the simplified management model.
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 13Mbps
**.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 20MHz
**.wlan[*].mac.hcf.rateSelection.dataFrameNumSpatialStreams = 1
**.wlan[*].mac.hcf.rateSelection.mgmtFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.controlFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseAckFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseBlockAckFrameBitrate = 6Mbps

[Config LongGI800ns]
description = "HT 802.11n Standard Long Guard Interval (800 ns)"
**.wlan[*].mac.hcf.isBlockAckSupported = true
**.wlan[*].bitrate = 13Mbps
**.wlan[*].radio.transmitter.guardInterval = 800ns

[Config ShortGI400ns]
description = "HT 802.11n Short Guard Interval (400 ns)"
**.wlan[*].mac.hcf.isBlockAckSupported = true
**.wlan[*].bitrate = 13Mbps
**.wlan[*].radio.transmitter.guardInterval = 400ns
