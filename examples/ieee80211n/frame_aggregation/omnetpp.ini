[General]
network = inet.examples.ieee80211.common.SingleBssNetwork
sim-time-limit = 1s

**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.wlan[*].mac.qosStation = true

# BSS setup
**.opMode = "n(mixed-2.4Ghz)"
**.numHosts = 3

# Position nodes
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m
**.host[*].mobility.initialY = 200m
**.host[0].mobility.initialX = 260m
**.host[1].mobility.initialX = 270m
**.host[2].mobility.initialX = 280m

# Identical UDP traffic setup from server to all hosts
*.server.numApps = 3
*.server.app[0..2].typename = "UdpBasicApp"
*.server.app[0..2].packetName = "UdpBasicApp" + string(index)
*.server.app[0..2].destAddresses = "host[" + string(index) + "]"
*.server.app[0..2].messageLength = 500B
*.server.app[0..2].sendInterval = 0.2ms
*.server.app[0..2].startTime = 0.2s
*.server.app[0..2].stopTime = 0.5s
*.server.app[0..2].destPort = 5000

*.host[*].numApps = 1
*.host[*].app[0].typename = "UdpSink"
*.host[*].app[0].localPort = 5000


[Config Base]
description = "Base HT configuration with Block Ack enabled"
abstract = true

# Pin the HT data mode and legacy management/control response modes.  The
# explicit values avoid an ambiguous fastest-mode lookup while peer HT
# capabilities are negotiated by the simplified management model.
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 13Mbps
**.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 20MHz
**.wlan[*].mac.hcf.rateSelection.dataFrameNumSpatialStreams = 1
**.wlan[*].mib.htMaxNss = 1
**.wlan[*].mac.hcf.rateSelection.mgmtFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.controlFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseAckFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseBlockAckFrameBitrate = 6Mbps

**.wlan[*].mac.hcf.isBlockAckSupported = true

[Config NoAggregation]
description = "HT 802.11n without MSDU or MPDU frame aggregation"
extends = Base
**.wlan[*].mac.hcf.isBlockAckSupported = false
**.wlan[*].mac.hcf.originatorMacDataService.msduAggregationPolicy.typename = ""
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.typename = ""

[Config AMsduOnly]
description = "HT 802.11n with A-MSDU frame aggregation only"
extends = Base
**.wlan[*].mac.hcf.isBlockAckSupported = false
**.wlan[*].mac.hcf.originatorMacDataService.msduAggregationPolicy.typename = "BasicMsduAggregationPolicy"
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.typename = ""
**.wlan[*].mac.hcf.originatorMacDataService.msduAggregationPolicy.maxAMsduSize = 7935

[Config AMpduOnly]
description = "HT 802.11n with A-MPDU frame aggregation only"
extends = Base
**.wlan[*].mac.hcf.originatorMacDataService.msduAggregationPolicy.typename = ""
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.typename = "VhtMpduAggregationPolicy"
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.maxAmpduLengthExponent = 3

[Config TwoLevelAggregation]
description = "HT 802.11n two-level aggregation (A-MSDU inside A-MPDU)"
extends = Base
**.wlan[*].mac.hcf.originatorMacDataService.msduAggregationPolicy.typename = "BasicMsduAggregationPolicy"
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.typename = "VhtMpduAggregationPolicy"
**.wlan[*].mac.hcf.originatorMacDataService.msduAggregationPolicy.maxAMsduSize = 3839
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.maxAmpduLengthExponent = 3
