[General]
network = inet.examples.ieee80211.common.SingleBssNetwork
sim-time-limit = 1s

# BSS setup
**.opMode = "n(mixed-2.4Ghz)"
**.numHosts = 2

# AP Address & Position
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m
**.host[0].mobility.initialX = 260m
**.host[0].mobility.initialY = 200m
**.host[1].mobility.initialX = 270m
**.host[1].mobility.initialY = 200m

# UDP traffic setup from server to host[0]
*.server.numApps = 1
*.server.app[0].typename = "UdpBasicApp"
*.server.app[0].destAddresses = "host[0]"
*.server.app[0].destPort = 5000
*.server.app[0].messageLength = 500B
*.server.app[0].sendInterval = 0.5ms
*.server.app[0].startTime = 0.2s
*.server.app[0].stopTime = 0.9s

[Config Base]
abstract = true
**.wlan[*].bitrate = 65Mbps

[Config StandardAck]
description = "Standard per-MPDU ACK policy without Block Ack"
extends = Base
**.wlan[*].mac.hcf.isBlockAckSupported = false

[Config ImmediateBlockAck]
description = "Immediate Block ACK policy with ADDBA setup"
extends = Base
**.wlan[*].mac.hcf.isBlockAckSupported = true

[Config CompressedBlockAck]
description = "HT Compressed Block ACK bitmap policy"
extends = Base
**.wlan[*].mac.hcf.isBlockAckSupported = true
**.wlan[*].mac.hcf.compressedBlockAck = true

[Config HtImplicitBlockAck]
description = "HT SIFS implicit Block ACK policy after A-MPDU burst"
extends = Base
**.wlan[*].mac.hcf.isBlockAckSupported = true
**.wlan[*].mac.hcf.useHtImplicitBlockAck = true
