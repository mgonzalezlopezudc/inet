[General]
network = inet.examples.ieee80211.common.SingleBssNetwork
sim-time-limit = 1s

# BSS setup
**.numHosts = 1
**.opMode = "n(mixed-2.4Ghz)"
**.wlan[*].radio.transmitter.power = 1mW



**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.wlan[*].mac.qosStation = true
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 26Mbps
**.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 20MHz
**.wlan[*].mac.hcf.rateSelection.dataFrameNumSpatialStreams = 1
**.wlan[*].mib.htShortGi20 = true
**.wlan[*].mib.htMaxNss = 1
**.wlan[*].mac.hcf.rateSelection.mgmtFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.controlFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseAckFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseBlockAckFrameBitrate = 6Mbps

# AP Address & Position
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m
**.host[0].mobility.initialY = 200m
**.host[0].mobility.initialX = 260m

# Enable mobility on host[0] to change distance over time
*.host[0].mobility.typename = "LinearMobility"
*.host[0].mobility.speed = 180mps
*.host[0].mobility.angle = 0deg

# Identical UDP traffic setup from server to all hosts
*.server.numApps = 1
*.server.app[0].typename = "UdpBasicApp"
*.server.app[0].packetName = "UdpBasicApp"
*.server.app[0].destAddresses = "host[0]"
*.server.app[0].messageLength = 1000B
*.server.app[0].sendInterval = 0.1ms
*.server.app[0].startTime = 0.2s
*.server.app[0].stopTime = 0.9s
*.server.app[*].destPort = 80

*.host[0].numApps = 1
*.host[0].app[0].typename = "UdpSink"
*.host[0].app[0].localPort = 80


[Config FixedConfig3]
description = "HT 802.11n fixed MCS 3 rate without dynamic rate adaptation"
**.wlan[*].bitrate = 26Mbps
**.wlan[*].mac.hcf.isBlockAckSupported = true
**.wlan[*].mac.hcf.rateControl.typename = ""

[Config HtAarfAdaptation]
description = "HT 802.11n dynamic AARF rate adaptation algorithm"
**.wlan[*].bitrate = 26Mbps
**.wlan[*].mac.hcf.isBlockAckSupported = true
**.wlan[*].mac.hcf.rateControl.typename = "AarfRateControl"
**.wlan[*].mac.hcf.rateControl.maxNss = 1
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = -1bps


