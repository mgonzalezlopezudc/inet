[General]
network = ChannelWidthsNetwork
sim-time-limit = 1s

# BSS setup
**.numHosts = 3
**.opMode = "n(mixed-2.4Ghz)"

# AP Address & Position
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m
**.host[*].mobility.initialY = 200m
**.host[0].mobility.initialX = 260m
**.host[1].mobility.initialX = 270m
**.host[2].mobility.initialX = 280m

# Identical UDP traffic setup from server to all hosts
*.server.numApps = 3
*.server.app[0..2].typename = "UdpBasicApp"
*.server.app[0..2].packetName = "UdpBasicApp" + string(index)
*.server.app[0..2].destAddresses = "host[" + string(index) + "]"
*.server.app[0..2].messageLength = 1200B
*.server.app[0..2].sendInterval = 0.3ms
*.server.app[0..2].startTime = 0.2s
*.server.app[0..2].stopTime = 0.5s
*.server.app[0..2].destPort = 80

*.host[*].numApps = 1
*.host[*].app[0].typename = "UdpSink"
*.host[*].app[0].localPort = 80


[Config Base]
abstract = true
**.wlan[*].mac.hcf.isBlockAckSupported = true
**.wlan[*].bitrate = 13Mbps
**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.wlan[*].mac.qosStation = true
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 13Mbps
**.wlan[*].mac.hcf.rateSelection.dataFrameNumSpatialStreams = 1
**.wlan[*].mib.htMaxNss = 1
**.wlan[*].radio.bandwidth = 20MHz
**.wlan[*].mac.hcf.rateSelection.mgmtFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.controlFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseAckFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseBlockAckFrameBitrate = 6Mbps


[Config Ht20MHz]
description = "HT 802.11n 20 MHz channel operation in 2.4 GHz"
extends = Base
**.opMode = "n(mixed-2.4Ghz)"
**.bandName = "2.4 GHz"
**.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 20MHz

[Config Ht40Base]
abstract = true
extends = Base

# Ieee80211Radio.channelNumber is a zero-based index into the INET band.
# HT Operation itself advertises the corresponding one-based IEEE channel.
*.host[*].wlan[*].radio.channelNumber = 0
*.ap.wlan[*].radio.channelNumber = 0
*.host[*].wlan[*].radio.bandwidth = 40MHz
*.ap.wlan[*].radio.bandwidth = 40MHz
*.host[*].wlan[*].htSecondaryChannelOffset = "above"
*.ap.wlan[*].htSecondaryChannelOffset = "above"
*.host[*].wlan[*].radio.receiver.bandwidth = 40MHz
*.ap.wlan[*].radio.receiver.bandwidth = 40MHz
*.host[*].wlan[*].mib.htShortGi40 = false
*.ap.wlan[*].mib.htShortGi40 = false
*.host[*].wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 40MHz
*.ap.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 40MHz
*.host[*].wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 27Mbps
*.ap.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 27Mbps

# Interferer on channel 4 (the secondary channel for HT40+)
*.interferer.wlan[*].opMode = "g(erp)"
*.interferer.wlan[*].mac.opMode = "g(erp)"
*.interferer.wlan[*].radio.opMode = "g(erp)"
*.interferer.wlan[*].radio.channelNumber = 4
*.interferer.wlan[*].radio.transmitter.power = 500mW
*.interferer.wlan[*].bitrate = 12Mbps
*.interferer.wlan[*].mac.*.rateSelection.dataFrameBandwidth = 20MHz
*.interferer.wlan[*].mac.*.rateSelection.dataFrameBitrate = 12Mbps
*.interferer.wlan[*].mac.hcf.typename = "Hcf"
*.interferer.wlan[*].mgmt.typename = "Ieee80211MgmtAdhoc"
*.interferer.wlan[*].agent.typename = ""
*.configurator.config = xml("<config><interface hosts='interferer' address='145.237.x.x' netmask='255.255.0.0'/><interface hosts='*' address='145.236.x.x' netmask='255.255.0.0'/></config>")
*.interferer.ipv4.ip.limitedBroadcast = true
*.interferer.numApps = 1
*.interferer.app[0].typename = "UdpBasicApp"
*.interferer.app[0].destAddresses = "145.237.255.255"
*.interferer.app[0].receiveBroadcast = true
*.interferer.app[0].destPort = 5000
*.interferer.app[0].messageLength = 1000B
*.interferer.app[0].sendInterval = uniform(0.9ms, 1.1ms)
*.interferer.app[0].startTime = uniform(0.2s, 0.201s)
*.interferer.mobility.typename = "StationaryMobility"
*.interferer.mobility.initialX = 265m
*.interferer.mobility.initialY = 210m
*.interferer.mobility.initFromDisplayString = false

[Config Ht40MHz]
description = "HT 802.11n 40 MHz channel operation in 2.4 GHz"
extends = Ht40Base
**.hasInterferer = false


[Config Ht40MHzSecondaryAboveWithInterferer]
description = "HT40+ (secondary channel above primary)"
extends = Ht40Base
**.hasInterferer = true

# Disable CSMA carrier sensing on the interferer (blind transmission)
*.interferer.wlan[*].radio.receiver.energyDetection = 100dBm
*.interferer.wlan[*].radio.receiver.sensitivity = 100dBm

*.host[*].wlan[*].radio.channelNumber = 0
*.ap.wlan[*].radio.channelNumber = 0
*.host[*].wlan[*].htSecondaryChannelOffset = "above"
*.ap.wlan[*].htSecondaryChannelOffset = "above"

[Config Ht40MHzSecondaryBelowWithInterferer]
description = "HT40- (secondary channel below primary)"
extends = Ht40Base
**.hasInterferer = true

# Disable CSMA carrier sensing on the interferer (blind transmission)
*.interferer.wlan[*].radio.receiver.energyDetection = 100dBm
*.interferer.wlan[*].radio.receiver.sensitivity = 100dBm

*.host[*].wlan[*].radio.channelNumber = 4
*.ap.wlan[*].radio.channelNumber = 4
*.host[*].wlan[*].htSecondaryChannelOffset = "below"
*.ap.wlan[*].htSecondaryChannelOffset = "below"
