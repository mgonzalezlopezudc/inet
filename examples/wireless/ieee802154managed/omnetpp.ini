[General]
network = ManagedPan
sim-time-limit = 300ms
cmdenv-express-mode = true
*.radioMedium.signalAnalogRepresentation = "scalar"
*.radioMedium.backgroundNoise.power = -110dBm
**.nic.radio.sendRawBytes = ${raw=false,true}
**.nic.radio.antenna.mobilityModule = "^.^.^.mobility"
*.coordinator.mobility.initialX = 0m
*.device.mobility.initialX = 1m
**.mobility.initFromDisplayString = false
**.mobility.initialY = 0m
**.mobility.initialZ = 0m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 100m
**.mobility.constraintAreaMaxY = 100m
**.mobility.constraintAreaMaxZ = 100m

[Config Beacon]
description = "Managed association and exchange with BO3/SO1 beacons"
sim-time-limit = 4s
**.nic.enableSuperframe = true
**.app.beaconOperation = true

[Config Gts]
extends = Beacon
description = "Managed bidirectional GTS exchange"
**.app.gtsOperation = true
**.app.cycles = 1

[Config Enhanced]
description = "Managed unacknowledged version-2 DATA"
sim-time-limit = 300ms
**.nic.enableEnhancedFrames = true
**.app.enhancedData = true
