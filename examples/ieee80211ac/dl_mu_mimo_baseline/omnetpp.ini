[General]
network = inet.examples.ieee80211.common.SingleBssNetwork
sim-time-limit = 1s

# BSS setup in 5 GHz
**.opMode = "ac"
**.numHosts = 2

# AP Address & Position
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m
**.host[0].mobility.initialX = 260m
**.host[0].mobility.initialY = 200m
**.host[1].mobility.initialX = 270m
**.host[1].mobility.initialY = 200m

# Configure AP multi-antenna array for MU-MIMO
*.ap.wlan[*].radio.antenna.numAntennas = 4

# Traffic flows to host[0] and host[1]
*.server.numApps = 2
*.server.app[0].typename = "UdpBasicApp"
*.server.app[0].destAddresses = "host[0]"
*.server.app[0].destPort = 5000
*.server.app[0].messageLength = 1000B
*.server.app[0].sendInterval = 0.5ms
*.server.app[0].startTime = 0.2s
*.server.app[0].stopTime = 0.9s

*.server.app[1].typename = "UdpBasicApp"
*.server.app[1].destAddresses = "host[1]"
*.server.app[1].destPort = 5001
*.server.app[1].messageLength = 1000B
*.server.app[1].sendInterval = 0.5ms
*.server.app[1].startTime = 0.2s
*.server.app[1].stopTime = 0.9s

*.host[0].numApps = 1
*.host[0].app[0].typename = "UdpSink"
*.host[0].app[0].localPort = 5000

*.host[1].numApps = 1
*.host[1].app[0].typename = "UdpSink"
*.host[1].app[0].localPort = 5001


[Config Base]
abstract = true
**.wlan[*].bitrate = 65Mbps

[Config VhtSingleUserBaseline]
description = "VHT 802.11ac Single-User sequential EDCA transmissions"
extends = Base
**.wlan[*].mac.hcf.isBlockAckSupported = true

[Config VhtDlMuMimoTwoUsers]
description = "VHT 802.11ac Downlink MU-MIMO simultaneous multi-user spatial transmission"
extends = Base
**.wlan[*].mac.hcf.isBlockAckSupported = true
