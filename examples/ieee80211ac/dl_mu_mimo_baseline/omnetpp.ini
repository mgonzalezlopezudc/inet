[General]
network = inet.examples.ieee80211.common.SingleBssNetwork
sim-time-limit = 1s

**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.wlan[*].mac.qosStation = true

# BSS setup in 5 GHz
**.bandName = "5 GHz (20 MHz)"
**.opMode = "ac"
**.numHosts = 3


# AP Address & Position
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m
**.host[*].mobility.initialY = 200m
**.host[0].mobility.initialX = 260m
**.host[1].mobility.initialX = 270m
**.host[2].mobility.initialX = 280m

# Server applications: three short warm-up flows establish Block Ack state and CSI sounding,
# followed by three high-rate backlogged flows to demonstrate Downlink MU-MIMO.
*.server.numApps = 6
*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destPort = 80
*.server.app[0..2].messageLength = 100B
*.server.app[0..2].sendInterval = 10ms
*.server.app[0..2].startTime = 0.2s
*.server.app[0..2].stopTime = 0.28s
*.server.app[0].destAddresses = "host[0]"
*.server.app[1].destAddresses = "host[1]"
*.server.app[2].destAddresses = "host[2]"

*.server.app[3..5].messageLength = 1000B
*.server.app[3..5].sendInterval = 0.25ms
*.server.app[3..5].startTime = 0.3s
*.server.app[3..5].stopTime = 0.5s
*.server.app[3].destAddresses = "host[0]"
*.server.app[4].destAddresses = "host[1]"
*.server.app[5].destAddresses = "host[2]"


*.host[*].numApps = 1
*.host[*].app[0].typename = "UdpSink"
*.host[*].app[0].localPort = 80


[Config Base]
abstract = true
**.wlan[*].mac.hcf.isBlockAckSupported = true
**.wlan[*].radio.receiver.bandwidth = 20MHz
**.wlan[*].mac.hcf.typename = "VhtHcf"
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 78Mbps
**.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 20MHz
**.wlan[*].mac.hcf.rateSelection.dataFrameNumSpatialStreams = 1
**.wlan[*].bitrate = 78Mbps
**.maxBlockAckPolicyFrameLength = 1100B


[Config VhtSingleUserBaseline]
description = "VHT 802.11ac Single-User sequential EDCA transmissions"
extends = Base

[Config VhtDlMuMimoThreeUsers]
description = "VHT 802.11ac Downlink MU-MIMO simultaneous spatial transmission to three users"
extends = Base

# Enable VHT DL MU-MIMO on AP and STA MACs; STAs must accept Group ID Management frames.
**.wlan[*].mac.hcf.enableVhtDlMuMimo = true
**.wlan[*].mac.hcf.enableVhtSuBeamforming = true
*.wlan[*].mac.hcf.vhtCsiValidityDuration = 500ms
*.wlan[*].mac.hcf.vhtSoundingRetryInterval = 500ms

# Four antennas at each endpoint allow the three associated one-stream STAs to
# receive a four-dimension sounding NDP and share one MU group.
*.ap.wlan[*].radio.antenna.numAntennas = 4
*.host[*].wlan[*].radio.antenna.numAntennas = 4

# VHT MU-MIMO and Beamforming MIB capabilities
*.ap.wlan[*].mib.vhtMuBeamformer = true
*.ap.wlan[*].mib.vhtSuBeamformer = true
*.ap.wlan[*].mib.vhtSoundingDimensions = 4
*.host[*].wlan[*].mib.vhtMuBeamformee = true
*.host[*].wlan[*].mib.vhtSuBeamformee = true
*.host[*].wlan[*].mib.vhtBeamformeeSts = 4
*.host[*].wlan[*].mib.vhtMaxNss = 1
