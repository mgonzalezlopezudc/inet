[General]
network = inet.examples.ieee80211.common.SingleBssNetwork
sim-time-limit = 1s

**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.wlan[*].mac.qosStation = true

# BSS setup in 5 GHz
**.bandName = "5 GHz (20 MHz)"
**.opMode = "ac"
**.numHosts = 3


# AP Address & Position
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m
**.host[*].mobility.initialY = 200m
**.host[0].mobility.initialX = 260m
**.host[1].mobility.initialX = 270m
**.host[2].mobility.initialX = 280m

# Configure AP multi-antenna array for MU-MIMO
*.ap.wlan[*].radio.antenna.numAntennas = 4

# Traffic flows to all three hosts
*.server.numApps = 3
*.server.app[0..2].typename = "UdpBasicApp"
*.server.app[0..2].packetName = "UdpBasicApp" + string(index)
*.server.app[0..2].destAddresses = "host[" + string(index) + "]"
*.server.app[0..2].messageLength = 1000B
*.server.app[0..2].sendInterval = 1ms
*.server.app[0..2].startTime = 0.2s
*.server.app[0..2].stopTime = 0.5s
*.server.app[*].destPort = 80

*.host[*].numApps = 1
*.host[*].app[0].typename = "UdpSink"
*.host[*].app[0].localPort = 80


[Config Base]
abstract = true
**.wlan[*].mac.hcf.typename = "VhtHcf"
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 65Mbps
**.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 20MHz
**.wlan[*].mac.hcf.rateSelection.dataFrameNumSpatialStreams = 1
**.wlan[*].bitrate = 65Mbps
**.maxBlockAckPolicyFrameLength = 1500B




[Config VhtSingleUserBaseline]
description = "VHT 802.11ac Single-User sequential EDCA transmissions"
extends = Base

[Config VhtDlMuMimoTwoUsers]
description = "VHT 802.11ac Downlink MU-MIMO simultaneous multi-user spatial transmission"
extends = Base

# Enable VHT DL MU-MIMO on AP MAC, and SU Beamforming (for sounding/CSI) on AP and host MACs
*.ap.wlan[*].mac.hcf.enableVhtDlMuMimo = true
**.wlan[*].mac.hcf.enableVhtSuBeamforming = true


# Antenna count for AP and hosts (2 antennas required for 2-stream sounding)
*.ap.wlan[*].radio.antenna.numAntennas = 2
*.host[*].wlan[*].radio.antenna.numAntennas = 2

# VHT MU-MIMO and Beamforming MIB capabilities
*.ap.wlan[*].mib.vhtMuBeamformer = true
*.ap.wlan[*].mib.vhtSuBeamformer = true
*.host[*].wlan[*].mib.vhtSuBeamformee = true
*.host[0..1].wlan[*].mib.vhtMuBeamformee = true
*.host[0..1].wlan[*].mib.vhtMaxNss = 1




