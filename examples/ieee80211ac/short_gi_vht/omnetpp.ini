[General]
network = inet.examples.ieee80211.common.SingleBssNetwork
sim-time-limit = 1s

**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.wlan[*].mac.qosStation = true
**.wlan[*].mac.hcf.rateSelection.mgmtFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.controlFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseAckFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseBlockAckFrameBitrate = 6Mbps

# BSS setup in 5 GHz
**.opMode = "ac"
**.numHosts = 3

# AP Address & Position
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m
**.host[*].mobility.initialY = 200m
**.host[0].mobility.initialX = 260m
**.host[1].mobility.initialX = 270m
**.host[2].mobility.initialX = 280m

# Two-stage UDP traffic setup
*.server.numApps = 6

# Stage 1: Warmup phase (Apps 0..2) to establish ADDBA agreements
*.server.app[0..2].typename = "UdpBasicApp"
*.server.app[0..2].destPort = 80
*.server.app[0..2].messageLength = 100B
*.server.app[0..2].sendInterval = 10ms
*.server.app[0..2].startTime = 0.2s
*.server.app[0..2].stopTime = 0.25s
*.server.app[0].destAddresses = "host[0]"
*.server.app[0].packetName = "UdpBasicApp0-Warmup"
*.server.app[1].destAddresses = "host[1]"
*.server.app[1].packetName = "UdpBasicApp1-Warmup"
*.server.app[2].destAddresses = "host[2]"
*.server.app[2].packetName = "UdpBasicApp2-Warmup"

# Stage 2: High-throughput saturated traffic phase (Apps 3..5)
*.server.app[3..5].typename = "UdpBasicApp"
*.server.app[3..5].destPort = 80
*.server.app[3..5].messageLength = 1000B
*.server.app[3..5].sendInterval = 0.25ms
*.server.app[3..5].startTime = 0.3s
*.server.app[3..5].stopTime = 0.5s
*.server.app[3].destAddresses = "host[0]"
*.server.app[3].packetName = "UdpBasicApp0"
*.server.app[4].destAddresses = "host[1]"
*.server.app[4].packetName = "UdpBasicApp1"
*.server.app[5].destAddresses = "host[2]"
*.server.app[5].packetName = "UdpBasicApp2"

*.host[*].numApps = 1
*.host[*].app[0].typename = "UdpSink"
*.host[*].app[0].localPort = 80

[Config Base]
abstract = true
**.wlan[*].bitrate = 65Mbps
**.bandName = "5 GHz (80 MHz)"
**.wlan[*].radio.receiver.bandwidth = 80MHz
**.maxBlockAckPolicyFrameLength = 1100B
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.typename = "VhtMpduAggregationPolicy"
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.maxAmpduLengthExponent = 3

[Config VhtLongGI]
description = "VHT 802.11ac Long Guard Interval (800 ns) in 80 MHz channel"
extends = Base
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 58.5Mbps
**.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 80MHz
**.wlan[*].mac.hcf.rateSelection.dataFrameNumSpatialStreams = 1

[Config VhtShortGI]
description = "VHT 802.11ac Short Guard Interval (400 ns) in 80 MHz channel"
extends = Base
**.wlan[*].mib.vhtShortGi80 = true
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 65Mbps
**.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 80MHz
**.wlan[*].mac.hcf.rateSelection.dataFrameNumSpatialStreams = 1
