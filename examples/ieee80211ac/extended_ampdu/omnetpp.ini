[General]
network = inet.examples.ieee80211.common.SingleBssNetwork
sim-time-limit = 1s

# BSS setup in 5 GHz
**.opMode = "ac"
**.numHosts = 2

# AP Address & Position
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m
**.host[0].mobility.initialX = 260m
**.host[0].mobility.initialY = 200m
**.host[1].mobility.initialX = 270m
**.host[1].mobility.initialY = 200m

# High-throughput UDP traffic setup
*.server.numApps = 1
*.server.app[0].typename = "UdpBasicApp"
*.server.app[0].destAddresses = "host[0]"
*.server.app[0].destPort = 5000
*.server.app[0].messageLength = 1400B
*.server.app[0].sendInterval = 0.05ms
*.server.app[0].startTime = 0.2s
*.server.app[0].stopTime = 0.9s

*.host[0].numApps = 1
*.host[0].app[0].typename = "UdpSink"
*.host[0].app[0].localPort = 5000


[Config Base]
abstract = true
**.wlan[*].bitrate = 65Mbps
**.wlan[*].mac.hcf.isBlockAckSupported = true

[Config StandardHtAmpduLimit]
description = "Standard 802.11n HT A-MPDU maximum length limit (65535 bytes)"
extends = Base
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.typename = "Ieee80211MpduAggregationPolicy"
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.maxAMpduSize = 65535B

[Config ExtendedVhtAmpduLimit]
description = "Extended 802.11ac VHT A-MPDU maximum length limit (1048575 bytes)"
extends = Base
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.typename = "Ieee80211MpduAggregationPolicy"
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.maxAMpduSize = 1048575B
