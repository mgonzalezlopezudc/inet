[General]
network = inet.examples.ieee80211.common.SingleBssNetwork
sim-time-limit = 1s


# BSS setup in 5 GHz
**.opMode = "ac"
**.numHosts = 3

**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.wlan[*].mac.qosStation = true
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 13Mbps
**.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 20MHz
**.wlan[*].mac.hcf.rateSelection.dataFrameNumSpatialStreams = 1
**.wlan[*].mac.hcf.rateSelection.mgmtFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.controlFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseAckFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.responseBlockAckFrameBitrate = 6Mbps

# AP Address & Position
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.host[*].**.mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"
**.ap.mobility.initialX = 250m
**.ap.mobility.initialY = 200m
**.host[*].mobility.initialY = 200m
**.host[0].mobility.initialX = 260m
**.host[1].mobility.initialX = 270m
**.host[2].mobility.initialX = 280m

# High-throughput UDP traffic setup
*.server.numApps = 3
*.server.app[0..2].typename = "UdpBasicApp"
*.server.app[0..2].packetName = "UdpBasicApp" + string(index)
# Keep all saturated streams on one receiver so the MAC can form same-RA,
# same-TID A-MSDUs before assembling the VHT A-MPDU.
*.server.app[0..2].destAddresses = "host[0]"
*.server.app[0..2].messageLength = 1400B
*.server.app[0..2].sendInterval = 0.01ms
*.server.app[0..2].startTime = 0.2s
*.server.app[0..2].stopTime = 0.5s
*.server.app[*].destPort = 80

*.host[*].numApps = 1
*.host[*].app[0].typename = "UdpSink"
*.host[*].app[0].localPort = 80


[Config Base]
abstract = true
**.bandName = "5 GHz (80 MHz)"
**.wlan[*].mac.hcf.isBlockAckSupported = true
# Use the negotiated VHT BlockAck path; the implicit-BlockAck mode is an
# INET extension intended for HT-style packet-level exchanges.
**.wlan[*].mac.hcf.useImplicitBlockAck = false

**.wlan[*].mib.vhtShortGi80 = true
**.wlan[*].bitrate = 390Mbps
**.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 80MHz
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 390Mbps
# A-MSDU-carrying MPDUs are larger than the 1,500-byte data packets used by
# the original scenario, so keep them eligible for the Block Ack policy.
**.maxBlockAckPolicyFrameLength = 4095B
**.wlan[*].mac.hcf.originatorMacDataService.msduAggregationPolicy.subframeNumThreshold = 2
**.wlan[*].mac.hcf.originatorMacDataService.msduAggregationPolicy.maxAMsduSize = 4065


[Config StandardVhtAmpduLimit]
description = "VHT A-MPDU policy limit (65535 bytes)"
extends = Base
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.typename = "VhtMpduAggregationPolicy"
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.maxAmpduLengthExponent = 3

[Config ExtendedVhtAmpduLimit]
description = "Extended 802.11ac VHT A-MPDU maximum length limit (1048575 bytes)"
extends = Base
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.typename = "VhtMpduAggregationPolicy"
**.wlan[*].mac.hcf.originatorMacDataService.mpduAggregationPolicy.maxAmpduLengthExponent = 7
