name: "Diagnostic: DTLS parent versus head"
run-name: "DTLS matched parent/head, ${{ github.run_id }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: omnetpp/omnetpp
          ref: 66ab32fb913825fa0371b42cb1397c6ffff5fb73
          path: omnetpp
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 980f5c3f9eb903fd9155dd8d24216a1c265d5f55
          path: inet
          fetch-depth: 0
          persist-credentials: false
      - run: mkdir -p /home/runner/work/ccache
      - uses: actions/cache/restore@v5
        with:
          path: /home/runner/work/ccache
          key: native-${{ matrix.mode }}-ccache-${{ github.run_id }}
          restore-keys: native-${{ matrix.mode }}-ccache
      - name: Same native toolchain for both immutable INET revisions
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-parent/$MODE"
          sudo apt update
          sudo apt install -y --no-install-recommends git wget curl ca-certificates \
            make ccache clang lld gdb bison flex perl doxygen graphviz libxml2-dev zlib1g-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libz3-dev libopenscenegraph-dev \
            python3 python3-venv
          {
            cat /etc/os-release
            printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -a
            clang++ --version
            python3 --version
            dpkg-query -W libz3-dev libz3-4 clang python3 libc6
            git -C "$GITHUB_WORKSPACE/omnetpp" rev-parse HEAD
          } > "$GITHUB_WORKSPACE/ci-parent/$MODE/environment.txt"
          source "$GITHUB_WORKSPACE/inet/_scripts/github/build-omnetpp.sh"
          python3 -m venv "$GITHUB_WORKSPACE/venv"
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          python3 -m pip install -r "$GITHUB_WORKSPACE/omnetpp/python/requirements.txt"
          python3 -m pip install "opp_repl @ git+https://github.com/omnetpp/opp_repl.git@155ac508b917594cf7e59e7d23c08b6d3ac0492a"
          python3 -m pip freeze > "$GITHUB_WORKSPACE/ci-parent/$MODE/pip-freeze.txt"
          for label in parent head; do
            if [ "$label" = parent ]; then
              revision=980f5c3f9eb903fd9155dd8d24216a1c265d5f55
            else
              revision=72206d774f8280b77e2f2cd3d4ae08fcef441285
            fi
            git -C "$GITHUB_WORKSPACE/inet" checkout --detach "$revision"
            source "$GITHUB_WORKSPACE/inet/_scripts/github/build-inet.sh"
            cd "$GITHUB_WORKSPACE/inet"
            mkdir -p "$GITHUB_WORKSPACE/ci-parent/$MODE/$label"
            git rev-parse HEAD > "$GITHUB_WORKSPACE/ci-parent/$MODE/$label/revision.txt"
            if [ "$MODE" = debug ]; then library=src/libINET_dbg.so; else library=src/libINET.so; fi
            sha256sum "$library" > "$GITHUB_WORKSPACE/ci-parent/$MODE/$label/library.sha256"
            ldd "$library" > "$GITHUB_WORKSPACE/ci-parent/$MODE/$label/library.ldd"
            grep libz3 "$GITHUB_WORKSPACE/ci-parent/$MODE/$label/library.ldd"
            if [ "$MODE" = release ]; then
              opp_checkout_test_baselines --load . -p inet statistical
              git -C statistics rev-parse HEAD > "$GITHUB_WORKSPACE/ci-parent/$MODE/$label/statistics-revision.txt"
            fi
            set +e
            python3 "$GITHUB_WORKSPACE/harness/_scripts/github/dtls-parent-cases.py" run \
              --mode "$MODE" --out "$GITHUB_WORKSPACE/ci-parent/$MODE/$label" \
              > "$GITHUB_WORKSPACE/ci-parent/$MODE/$label/cases.log" 2>&1
            case_status=$?
            set -e
            echo "$case_status" > "$GITHUB_WORKSPACE/ci-parent/$MODE/$label/cases.exit"
            cat "$GITHUB_WORKSPACE/ci-parent/$MODE/$label/cases.log"
          done
          python3 "$GITHUB_WORKSPACE/harness/_scripts/github/dtls-parent-cases.py" compare \
            --mode "$MODE" --out "$GITHUB_WORKSPACE/ci-parent/$MODE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dtls-ci-parent-${{ matrix.mode }}
          path: ${{ github.workspace }}/ci-parent/${{ matrix.mode }}
          if-no-files-found: error
