[General]
network = TgnChannelShowcase
sim-time-limit = 25ms
seed-set = 11

*.sourceHost.ipv4.arp.typename = "GlobalArp"
*.destinationHost.ipv4.arp.typename = "GlobalArp"

*.sourceHost.wlan[0].mgmt.typename = "Ieee80211MgmtAdhoc"
*.destinationHost.wlan[0].mgmt.typename = "Ieee80211MgmtAdhoc"
*.sourceHost.wlan[0].agent.typename = ""
*.destinationHost.wlan[0].agent.typename = ""
**.wlan[0].opMode = "n(mixed-2.4Ghz)"
**.wlan[0].bitrate = 6.5Mbps
**.wlan[0].radio.typename = "Ieee80211TgnRadio"

*.sourceHost.numApps = 1
*.sourceHost.app[0].typename = "UdpBasicApp"
*.sourceHost.app[0].destAddresses = "destinationHost"
*.sourceHost.app[0].destPort = 5000
*.sourceHost.app[0].messageLength = 200B
*.sourceHost.app[0].sendInterval = 5ms
*.sourceHost.app[0].startTime = 5ms
*.destinationHost.numApps = 1
*.destinationHost.app[0].typename = "UdpSink"
*.destinationHost.app[0].localPort = 5000

*.radioMedium.profile = "D"
*.radioMedium.condition = "nlos"
*.radioMedium.timeVariation = true
*.radioMedium.reciprocal = false
*.radioMedium.backgroundNoise.power = -110dBm

# Default showcase is a 2x1 one-stream MRC link. Transmitters publish immutable
# spatial plans and the opt-in TGn receiver materializes the matrix resources.
*.sourceHost.wlan[0].radio.antenna.numAntennas = 1
*.destinationHost.wlan[0].radio.antenna.numAntennas = 2

[Config ModelA]
description = "TGn Model A with the default 2x1 MRC receiver layout"
*.radioMedium.profile = "A"

[Config ModelB]
description = "TGn Model B with the default 2x1 MRC receiver layout"
*.radioMedium.profile = "B"

[Config ModelC]
description = "TGn Model C with the default 2x1 MRC receiver layout"
*.radioMedium.profile = "C"

[Config ModelD]
description = "TGn Model D with the default 2x1 MRC receiver layout"
*.radioMedium.profile = "D"

[Config ModelE]
description = "TGn Model E with the default 2x1 MRC receiver layout"
*.radioMedium.profile = "E"

[Config ModelF]
description = "TGn Model F with the default 2x1 MRC receiver layout"
*.radioMedium.profile = "F"

[Config Siso]
description = "TGn Model D with a 1x1 SISO antenna layout"
*.sourceHost.wlan[0].radio.antenna.numAntennas = 1
*.destinationHost.wlan[0].radio.antenna.numAntennas = 1

[Config Matrix2x2]
description = "TGn Model D with a 2x2 channel matrix and configured receiver strategy"
*.sourceHost.wlan[0].radio.antenna.numAntennas = 2
*.destinationHost.wlan[0].radio.antenna.numAntennas = 2

[Config StaticDiagnostic]
description = "TGn Model D static-channel diagnostic with temporal effects disabled"
*.radioMedium.timeVariation = false
*.radioMedium.vehicleEffect = false
*.radioMedium.fluorescentEffect = false
