include ../../../examples/ieee80211ax/channel_widths/omnetpp.ini

[Config HePlanningBase]
abstract = true
description = "Shared deterministic topology and HE planning settings."
seed-set = 1
sim-time-limit = 1s
warmup-period = 0.1s
*.numHosts = 4

# The inherited channel-width network supplies the AP, wired server, and HE
# radios. Keep every STA stationary and near the AP, with a position derived
# only from its stable array index.
*.ap.mobility.typename = "StationaryMobility"
*.host[*].mobility.typename = "StationaryMobility"
*.ap.mobility.initFromDisplayString = false
*.host[*].mobility.initFromDisplayString = false
*.ap.mobility.initialX = 300m
*.ap.mobility.initialY = 200m
*.host[*].mobility.initialX = 180m + 3m * parentIndex()
*.host[*].mobility.initialY = 200m
*.ap.wlan[*].address = "10:00:00:00:00:00"
*.host[*].wlan[*].mgmt.accessPointAddress = "10:00:00:00:00:00"
**.arp.typename = "GlobalArp"
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"

**.opMode = "ax"
**.centerFrequency = 5.2GHz
**.wlan[*].radio.transmitter.power = 30mW
**.wlan[*].radio.receiver.snirThreshold = 4dB
**.mac.qosStation = true
**.wlan[*].classifier.typename = "ExampleQosClassifier"
**.mac.hcf.typename = "HeHcf"
**.ap.wlan[*].mac.hcf.dlScheduler.typename = "HeDlSchedulerEqualSizedRUs"
**.ap.wlan[*].mac.hcf.maxHeMuPpduDuration = 1ms
**.isBlockAckSupported = true
**.wlan[*].mac.hcf.originatorAckPolicy.maxBlockAckPolicyFrameLength = 2000B
**.mac.hcf.originatorBlockAckAgreementPolicy.addbaFailureTimeout = 10ms

# Performance measurements are process-level. Simulation result recording is
# disabled so the benchmark measures the scheduling and transmission path.
**.vector-recording = false
**.scalar-recording = false
**.bin-recording = false
**.param-recording = false

[Config HePlanning20MHz]
abstract = true
description = "20 MHz HE channel-width input for planning cases."
extends = HePlanningBase, Width20MHz

[Config HePlanning80MHz]
abstract = true
description = "80 MHz HE channel-width input for planning cases."
extends = HePlanningBase, Width80MHz

[Config HePlanning160MHz]
abstract = true
description = "160 MHz HE channel-width input for planning cases."
extends = HePlanningBase, Width160MHz

[Config HePlanning1Sta]
abstract = true
description = "One-station topology input for planning cases."
*.numHosts = 1

[Config HePlanning4Sta]
abstract = true
description = "Four-station topology input for planning cases."
*.numHosts = 4

[Config HePlanning9Sta]
abstract = true
description = "Nine-station topology input for planning cases."
*.numHosts = 9

[Config HePlanning37Sta]
abstract = true
description = "Thirty-seven-station topology input for planning cases."
*.numHosts = 37

[Config HePlanningDl]
abstract = true
description = "Downlink HE OFDMA planning traffic to every station."
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000
*.server.app[1..].typename = "UdpBasicApp"
*.server.app[1..].destPort = 5000
*.server.app[1..].messageLength = 1000B
*.host[*].numApps = 1
*.host[*].app[0].typename = "UdpSink"
*.host[*].app[0].localPort = 5000
**.wlan[*].mac.hcf.enableUlMuOfdma = false

# Establish one ADDBA agreement per peer before the sustained planning phase,
# matching the channel-width OFDMA scenario from which this harness extends.
[Config HePlanningDl1StaTraffic]
abstract = true
description = "One DL peer with one ADDBA warmup packet and one sustained flow."
extends = HePlanning1Sta
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 1
*.server.numApps = 3
*.server.app[1].packetName = "he-planning-dl-warmup-0"
*.server.app[1].destAddresses = "host[0]"
*.server.app[1].sendInterval = 1s
*.server.app[1].startTime = 200ms
*.server.app[1].stopTime = 250ms
*.server.app[2].packetName = "he-planning-dl-0"
*.server.app[2].destAddresses = "host[0]"
*.server.app[2].sendInterval = 1ms
*.server.app[2].startTime = 300ms
*.server.app[2].stopTime = 1s

[Config HePlanningDl4StaTraffic]
abstract = true
description = "Four DL peers with per-peer ADDBA warmups and sustained flows."
extends = HePlanning4Sta
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 4
*.server.numApps = 9
*.server.app[1..4].packetName = "he-planning-dl-warmup-" + string(index - 1)
*.server.app[1..4].destAddresses = "host[" + string(index - 1) + "]"
*.server.app[1..4].sendInterval = 1s
*.server.app[1..4].startTime = 200ms
*.server.app[1..4].stopTime = 250ms
*.server.app[5..8].packetName = "he-planning-dl-" + string(index - 5)
*.server.app[5..8].destAddresses = "host[" + string(index - 5) + "]"
*.server.app[5..8].sendInterval = 1ms
*.server.app[5..8].startTime = 300ms
*.server.app[5..8].stopTime = 1s

[Config HePlanningDl9StaTraffic]
abstract = true
description = "Nine DL peers with per-peer ADDBA warmups and sustained flows."
extends = HePlanning9Sta
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 9
*.server.numApps = 19
*.server.app[1..9].packetName = "he-planning-dl-warmup-" + string(index - 1)
*.server.app[1..9].destAddresses = "host[" + string(index - 1) + "]"
*.server.app[1..9].sendInterval = 1s
*.server.app[1..9].startTime = 200ms
*.server.app[1..9].stopTime = 250ms
*.server.app[10..18].packetName = "he-planning-dl-" + string(index - 10)
*.server.app[10..18].destAddresses = "host[" + string(index - 10) + "]"
*.server.app[10..18].sendInterval = 1ms
*.server.app[10..18].startTime = 300ms
*.server.app[10..18].stopTime = 1s

[Config HePlanningDl37StaTraffic]
abstract = true
description = "Thirty-seven DL peers with per-peer ADDBA warmups and sustained flows."
extends = HePlanning37Sta
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 37
*.server.numApps = 75
*.server.app[1..37].packetName = "he-planning-dl-warmup-" + string(index - 1)
*.server.app[1..37].destAddresses = "host[" + string(index - 1) + "]"
*.server.app[1..37].sendInterval = 1s
*.server.app[1..37].startTime = 200ms
*.server.app[1..37].stopTime = 250ms
*.server.app[38..74].packetName = "he-planning-dl-" + string(index - 38)
*.server.app[38..74].destAddresses = "host[" + string(index - 38) + "]"
*.server.app[38..74].sendInterval = 1ms
*.server.app[38..74].startTime = 300ms
*.server.app[38..74].stopTime = 1s

[Config HePlanningSu]
abstract = true
extends = HePlanningDl
description = "Single-user HE fallback with the same per-station downlink queues."
# A zero candidate limit makes the DL scheduler return no MU allocation, so
# HeHcf keeps the workload's queue setup but transmits with the SU fallback.
**.ap.wlan[*].mac.hcf.dlScheduler.maxMuStations = 0

[Config HePlanningUl]
abstract = true
description = "Scheduled uplink HE OFDMA planning traffic from every station."
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000
*.host[*].numApps = 1
*.host[*].app[0].typename = "UdpBasicApp"
*.host[*].app[0].packetName = "he-planning-ul-" + string(parentIndex())
*.host[*].app[0].destAddresses = "server"
*.host[*].app[0].destPort = 5000
*.host[*].app[0].messageLength = 400B
*.host[*].app[0].sendInterval = 1ms
*.host[*].app[0].startTime = 20ms
*.host[*].app[0].stopTime = 1s
**.wlan[*].mac.hcf.enableUlMuOfdma = true
**.ap.wlan[*].mac.hcf.ulTriggerPolicy.minimumTriggerInterval = 5ms
**.ap.wlan[*].mac.hcf.ulScheduler.typename = "HeUlSchedulerEqualSizedRUs"
**.ap.wlan[*].mac.hcf.ulScheduler.maxMuStations = 37
**.ap.wlan[*].mac.hcf.ulScheduler.minRandomAccessRus = 0
**.ap.wlan[*].mac.hcf.ulScheduler.maxRandomAccessRus = 0

